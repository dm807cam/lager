name: CI

# Tests, the installer check and a Docker smoke test run on every pull request and push. Pushes to main and release
# tags then publish ghcr.io/<owner>/lager for linux/amd64 and linux/arm64, and older builds are deleted:
#   push to main      -> :edge (the previous edge build is deleted)
#   tag v1.2.3        -> :1.2.3, :1.2, :1 and :latest
#   tag v0.4.1        -> :0.4.1, :0.4 and :latest (no :0: in 0.x every minor release may break)
#   tag v1.2.3-rc.1   -> :1.2.3-rc.1
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request makes the older run pointless; a publish on main or a tag always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The Node major of the Docker image (Dockerfile) and the minimum in package.json "engines": move all three together.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  installer:
    name: Installer script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # ShellCheck is preinstalled on GitHub's Ubuntu runners. The behaviour is tested in tests/install-script.test.ts.
      - name: ShellCheck
        run: shellcheck install.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lager:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Smoke test
        run: |
          docker run -d --name lager -p 8080:8080 \
            -e LAGER_PUBLIC_URL=http://localhost:8080 \
            -e LAGER_APPS_DOMAIN=apps.localhost \
            -e LAGER_ADMIN_EMAIL=admin@example.com \
            -e LAGER_ADMIN_PASSWORD=ci-password-123 \
            lager:ci
          for i in $(seq 1 30); do
            if curl -fsS -H 'Host: localhost:8080' http://127.0.0.1:8080/healthz; then
              echo; echo "Lager is up."
              curl -fsS -o /dev/null -H 'Host: localhost:8080' http://127.0.0.1:8080/login
              # The image is a copy of the program, so it must carry the license (AGPL section 4).
              docker exec lager test -s /app/LICENSE
              exit 0
            fi
            sleep 1
          done
          echo "Lager did not become healthy in time." >&2
          docker logs lager
          exit 1

      - name: Container log
        if: always()
        run: docker logs lager || true

  dco:
    name: DCO sign-off
    # Every commit needs a Signed-off-by line with its author's address (see CONTRIBUTING.md, "Signing off your work").
    # Pull requests the repository owner opens are exempt: the owner answers for every commit they merge. Bot commits
    # (Dependabot) are exempt as well.
    if: github.event_name == 'pull_request' && github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%ae' "$sha")
            case "$author" in *'[bot]@users.noreply.github.com') continue ;; esac
            # The sign-off must carry the commit author's own address.
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "<$author>"; then
              echo "::error::Commit $(git show -s --format='%h %s' "$sha") has no Signed-off-by line for its author <$author>."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign off your commits: git fetch upstream && git rebase --signoff upstream/main, then git push --force-with-lease."
            echo "Why we ask for it: https://github.com/$REPO/blob/main/CONTRIBUTING.md#signing-off-your-work-dco"
            exit 1
          fi
          echo "Every commit is signed off by its author."

  publish:
    name: Publish image
    # Only what passed the tests and the smoke test is published.
    if: github.event_name == 'push'
    needs: [test, installer, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=Lager
            org.opencontainers.image.description=Self-hosted server for the apps your AI builds
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          provenance: true
          sbom: true

  cleanup:
    name: Delete old images
    # Keeps every release tag, :latest and the current :edge. Deleted: earlier edge builds (untagged once :edge moved on)
    # and the :sha-<commit> tags that older builds carried. The action knows multi-platform images, so it never deletes
    # the platform images and attestations that a kept tag still points to.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: lager
          delete-tags: sha-*
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          # A build that another run is pushing right now is briefly untagged; it is younger than this and stays.
          older-than: 10 minutes
