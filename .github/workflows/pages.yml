name: Website

# Publishes the website to GitHub Pages, served at https://lager.im (the custom domain is set in Settings → Pages;
# website/CNAME only records it: Actions deployments ignore the file). scripts/website.mjs copies website/ and
# generates the changelog page from CHANGELOG.md and the blog from website/blog/posts/, so a release (its pull
# request updates CHANGELOG.md on main) and a merged post both publish themselves. Pull requests only build the
# site, so a broken page or link shows up before the merge; pushes to main also deploy it, and a daily run
# publishes posts dated for that day. Pages must use "GitHub Actions" as its source (Settings → Pages).

on:
  push:
    branches: [main]
    paths: ['website/**', 'CHANGELOG.md', 'scripts/website.mjs', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['website/**', 'CHANGELOG.md', 'scripts/website.mjs', '.github/workflows/pages.yml']
  schedule:
    # Posts dated in the future appear on their day.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one that is half done.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Copies website/, renders the changelog and the blog, and fails on any local link to a missing file.
      - name: Build the site
        run: node scripts/website.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
