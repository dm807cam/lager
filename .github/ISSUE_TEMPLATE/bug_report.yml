name: 🐛 Bug report
description: Something in Lager does not work as documented.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please [search existing issues](https://github.com/dm807cam/lager/issues?q=is%3Aissue) first.
        **Security problems do not belong here.** Report them privately as described in the [security policy](https://github.com/dm807cam/lager/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that lead to the bug, starting from a fresh page load if possible.
      placeholder: |
        1. Deploy an app with capabilities {"db": {}}
        2. Share the instance with a second account as a viewer
        3. Open the instance as the second account
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lager version or commit
      description: The image tag (for example `ghcr.io/dm807cam/lager:1.2.3`) or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Lager?
      options:
        - Docker Compose with a published image
        - Docker Compose, built from source
        - From source (npm)
        - Other (please describe below)
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Reverse proxy
      placeholder: Nginx Proxy Manager, Traefik, Caddy, none…
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Dashboard or administration
        - Apps and instances (hosting, versions, data)
        - Sharing and access
        - MCP connector or OAuth
        - REST API
        - AI models (lager.complete)
        - Custom domains
        - Translations
        - Installation or Docker
        - Not sure
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Only if the problem shows in the browser.
      placeholder: Safari on iOS 19, Firefox 140 on Linux…
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Output of `docker compose logs lager` or the browser console. **Remove passwords, tokens and personal data first.**
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, configuration (without secrets), ideas about the cause.
